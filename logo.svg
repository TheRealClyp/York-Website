<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="york-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <polygon points="200,20 370,115 370,305 200,380 30,305 30,115" fill="#0f1117" stroke="url(#york-grad)" stroke-width="10" filter="url(#shadow)"/>

  <!-- Inner Geometric Y & Systems Core -->
  <g fill="none" stroke="url(#york-grad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="22">
    <!-- Letter Y Vector -->
    <path d="M 120,120 L 200,220 L 280,120"/>
    <path d="M 200,220 L 200,300"/>
  </g>

  <!-- Core Node / Spark -->
  <circle cx="200" cy="220" r="12" fill="#60a5fa"/>
  <circle cx="200" cy="220" r="6" fill="#ffffff"/>
</svg>
